<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicBridge | AI Transporter</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            /* Modern gradient background */
            background: radial-gradient(circle at top left, #1db954, #121212 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Glassmorphism Card */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            width: 400px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 { margin-bottom: 10px; font-size: 28px; }
        p { color: #ccc; margin-bottom: 30px; }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            margin-bottom: 20px;
            outline: none;
            box-sizing: border-box; /* Fixes padding issues */
        }

        button {
            width: 100%;
            padding: 15px;
            background: #1db954;
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #1ed760;
            transform: scale(1.02);
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            min-height: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 MusicBridge</h1>
        <p>AI-Powered Playlist Transfer</p>
        
        <input type="text" id="pName" placeholder="Enter Playlist Name" value="Hackathon Demo Playlist">
        <button onclick="transfer()">Start Export</button>
        
        <div id="status"></div>
    </div>

    <script>
        async function transfer() {
            const status = document.getElementById("status");
            const btn = document.querySelector("button");
            const pName = document.getElementById("pName").value;

            status.innerText = "⏳ Connecting to Google & AI...";
            status.style.color = "#FFD700"; // Gold color for loading
            btn.disabled = true; // Prevent double clicks
            btn.style.opacity = "0.7";

            try {
                const res = await fetch("/export", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ playlist_name: pName })
                });

                const data = await res.json();

                if (data.status === "success") {
                    status.innerHTML = "✅ <b>Success!</b><br>AI Description: " + data.ai_desc;
                    status.style.color = "#90EE90"; // Light green
                } else {
                    status.innerText = "❌ Error: " + (data.message || "Unknown error");
                    status.style.color = "#FF6347"; // Red
                }
            } catch (error) {
                status.innerText = "❌ Network Error. Is the server running?";
                status.style.color = "#FF6347";
            }
            
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    </script>
</body>
</html>
